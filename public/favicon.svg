<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Anas Vhora  Portfolio">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0e1428"/>
      <stop offset="100%" stop-color="#05070d"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff4c8"/>
      <stop offset="55%" stop-color="#e8c547"/>
      <stop offset="100%" stop-color="#9b6d1b"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- star field -->
  <circle cx="10" cy="12" r="0.9" fill="#ffffff" opacity="0.85"/>
  <circle cx="54" cy="15" r="0.7" fill="#ffffff" opacity="0.6"/>
  <circle cx="18" cy="52" r="0.7" fill="#ffffff" opacity="0.7"/>
  <circle cx="48" cy="49" r="0.8" fill="#ffffff" opacity="0.55"/>
  <circle cx="7"  cy="40" r="0.55" fill="#ffffff" opacity="0.5"/>
  <!-- hexagon outline -->
  <polygon points="32,10 52,22 52,42 32,54 12,42 12,22"
           fill="none" stroke="url(#gold)" stroke-width="2.2" stroke-linejoin="round"/>
  <!-- inner ring -->
  <circle cx="32" cy="32" r="6.5" fill="none" stroke="url(#gold)" stroke-width="1.3" stroke-dasharray="2 3"/>
  <!-- crosshair ticks -->
  <g stroke="url(#gold)" stroke-width="1.6" stroke-linecap="round">
    <line x1="32" y1="4"  x2="32" y2="8"/>
    <line x1="32" y1="56" x2="32" y2="60"/>
    <line x1="4"  y1="32" x2="8"  y2="32"/>
    <line x1="56" y1="32" x2="60" y2="32"/>
  </g>
  <!-- singularity -->
  <circle cx="32" cy="32" r="2.2" fill="#fff4c8"/>
</svg>
